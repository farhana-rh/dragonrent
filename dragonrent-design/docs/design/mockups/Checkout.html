<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check and send on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7FAFC}
b,strong{font-weight:600}
*{box-sizing:border-box}
h1,h2,h3,p,ol,ul{margin:0}
h1,h2,h3{font-family:'Geist',system-ui,sans-serif}
input,button,textarea{font:inherit;color:inherit}
a{color:#2457C5}a:hover{color:#1B46A3}
::placeholder{color:#66768F;opacity:1}
:focus-visible{outline:3px solid #2457C5;outline-offset:3px}
.field:focus-within{outline:3px solid #2457C5;outline-offset:2px}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div style="width:390px;height:1180px;position:relative;background:#F7FAFC;color:#172B4D;font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden">

<header style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#FFFFFF;border-bottom:1px solid #E7EBF0">
<a href="Dates.dc.html" style="display:flex;align-items:center;gap:6px;height:48px;padding:0 10px 0 4px;color:#172B4D;text-decoration:none;font-weight:600;font-size:15px"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>Back</a>
<span style="font-weight:600;font-size:15px;color:#4A5B78">Step 2 of 2</span>
</header>

<div style="padding:24px 20px 170px;display:flex;flex-direction:column;gap:20px">
<h1 style="font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-0.6px">Check and send</h1>

<section style="background:#FFFFFF;border:1px solid #E7EBF0;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:14px;align-items:center">
<div style="flex:none;width:72px;height:72px;border-radius:10px;background:#E8EEF7;display:flex;align-items:center;justify-content:center;color:#7A8AA3"><svg class="i" width="40" height="40" viewBox="0 0 24 24" role="img" aria-label="Photo placeholder: cordless drill" style="stroke-width:1.4"><rect x="3" y="5" width="12" height="6" rx="2"></rect><path d="M15 8h3M18 7v2M18 8h3"></path><path d="M6 11l-1 6a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1l1-6"></path><rect x="4" y="18" width="7" height="3" rx="1"></rect></svg></div>
<div style="display:flex;flex-direction:column;line-height:1.35"><p style="font-weight:600">Cordless drill with 2 batteries</p><p style="font-size:13px;color:#4A5B78">From Anna K. in Kallio</p></div>
</div>
<div style="height:1px;background:#E7EBF0"></div>
<div style="display:flex;justify-content:space-between;gap:12px"><span style="color:#4A5B78">Pick up</span><span style="font-weight:600">Fri 23 Oct</span></div>
<div style="display:flex;justify-content:space-between;gap:12px"><span style="color:#4A5B78">Return</span><span style="font-weight:600">Sun 25 Oct</span></div>
<a href="Dates.dc.html" style="align-self:flex-start;display:flex;align-items:center;min-height:44px;font-weight:600;color:#2457C5">Change dates</a>
</section>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="msg" style="font-weight:600;font-size:15px">Message to Anna <span style="font-weight:400;color:#4A5B78">(optional)</span></label>
<textarea id="msg" class="field" rows="3" placeholder="Hi Anna! Could I pick it up on Friday evening?" style="min-height:116px;padding:14px 16px;border:1px solid #E7EBF0;border-radius:10px;background:#FFFFFF;font-size:16px;resize:vertical;outline:0"></textarea>
<p style="font-size:13px;color:#4A5B78">Say hello and when you'd like to pick it up.</p>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="card" style="font-weight:600;font-size:15px">Card details</label>
<div class="field" style="display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border:1px solid #E7EBF0;border-radius:10px;background:#FFFFFF">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="color:#4A5B78"><rect width="20" height="14" x="2" y="5" rx="2"></rect><path d="M2 10h20"></path></svg>
<input id="card" type="text" placeholder="Card number · MM/YY · CVC" style="border:0;outline:0;flex:1;min-width:0;font-size:16px;background:transparent">
</div>
<label style="display:flex;align-items:center;gap:12px;min-height:48px;font-size:15px;cursor:pointer"><input type="checkbox" style="width:24px;height:24px;margin:0;accent-color:#2457C5">Save this card for next time</label>
</div>

<section style="background:#FFFFFF;border:1px solid #E7EBF0;border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;gap:12px"><span>3 days × €10</span><span>€30</span></div>
<div style="display:flex;justify-content:space-between;gap:12px"><span>Service fee</span><span>€3</span></div>
<div style="height:1px;background:#E7EBF0;margin:4px 0"></div>
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span style="font-weight:600;font-size:18px">Total</span><span style="font-weight:600;font-size:24px">€33</span></div>
</section>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-top:1px solid #E7EBF0;box-shadow:0 -8px 24px rgba(23,43,77,0.08);padding:14px 16px 22px;display:flex;flex-direction:column;gap:10px">
<p style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:#4A5B78"><span style="color:#2457C5"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>Charged only if Anna says yes</p>
<a href="Sent.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:10px;background:#2457C5;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:16px">Send request</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const brand = '#2457C5';
    const tint = '#DCE8FA';
    return { brand: brand, brandTint: tint };
  }
}
</script>
</body>
</html>
